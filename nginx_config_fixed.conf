# Default server configuration
#

server {
        listen 80 default_server;
        listen [::]:80 default_server;

        # ============================================
        # UPLOAD SIZE LIMITS - ✅ YOU ADDED THIS CORRECTLY
        # ============================================
        client_max_body_size 150M;
        client_body_timeout 300s;
        client_header_timeout 300s;

        # SSL configuration
        #
        # listen 443 ssl default_server;
        # listen [::]:443 ssl default_server;
        #
        # Note: You should disable gzip for SSL traffic.
        # See: https://bugs.debian.org/773332
        #
        # Read up on ssl_ciphers to ensure a secure configuration.
        # See: https://bugs.debian.org/765782
        #
        # Self signed certs generated by the ssl-cert package
        # Don't use them in a production server!
        #
        # include snippets/snakeoil.conf;

        # ============================================
        # ROOT DIRECTORY - ✅ YOU SET THIS CORRECTLY
        # ============================================
        root /var/www/tourism/public;

        # ============================================
        # INDEX FILES - ❌ NEEDS FIX: Add index.php
        # ============================================
        index index.php index.html index.htm index.nginx-debian.html;

        server_name _;  # Change to your domain if you have one

        # ============================================
        # LARAVEL ROUTING - ❌ NEEDS FIX: Change =404 to Laravel routing
        # ============================================
        location / {
                # First attempt to serve request as file, then
                # as directory, then fall back to Laravel index.php
                try_files $uri $uri/ /index.php?$query_string;
        }

        # ============================================
        # PHP PROCESSING - ❌ NEEDS FIX: Uncomment and update
        # ============================================
        location ~ \.php$ {
                include snippets/fastcgi-php.conf;

                # With php-fpm (or other unix sockets):
                # Check your PHP version first: ls /run/php/php*-fpm.sock
                fastcgi_pass unix:/run/php/php8.3-fpm.sock;  # Update version if needed
                
                # FastCGI buffer sizes for large uploads
                fastcgi_buffer_size 128k;
                fastcgi_buffers 4 256k;
                fastcgi_busy_buffers_size 256k;
                fastcgi_read_timeout 300s;
                
                # With php-cgi (or other tcp sockets):
                # fastcgi_pass 127.0.0.1:9000;
        }

        # ============================================
        # SECURITY - ❌ NEEDS FIX: Uncomment this block
        # ============================================
        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        location ~ /\.ht {
                deny all;
        }
        
        # Deny access to sensitive Laravel files
        location ~* \.(env|log|htaccess|htpasswd|ini|phps|fla|psd|sh)$ {
                deny all;
        }
}

