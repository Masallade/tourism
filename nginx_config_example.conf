# Nginx Configuration Example for Tourism App
# Place this in /etc/nginx/sites-available/your-site-name

server {
    listen 80;
    server_name unisontour.com www.unisontour.com;
    
    # ============================================
    # UPLOAD SIZE LIMITS - CRITICAL FOR FIXING 413 ERROR
    # ============================================
    client_max_body_size 150M;        # Maximum upload size (7 docs × 10MB + buffer)
    client_body_timeout 300s;         # Timeout for uploads
    client_header_timeout 300s;       # Timeout for headers
    
    # ============================================
    # ROOT AND INDEX
    # ============================================
    root /var/www/tourism/public;
    index index.php index.html index.htm;
    
    # ============================================
    # LOGGING
    # ============================================
    access_log /var/log/nginx/tourism_access.log;
    error_log /var/log/nginx/tourism_error.log;
    
    # ============================================
    # LARAVEL ROUTING
    # ============================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # ============================================
    # PHP PROCESSING
    # ============================================
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # FastCGI buffer sizes for large uploads
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300s;
    }
    
    # ============================================
    # STATIC FILES
    # ============================================
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # ============================================
    # SECURITY
    # ============================================
    location ~ /\. {
        deny all;
    }
    
    # Deny access to sensitive files
    location ~* \.(env|log|htaccess|htpasswd|ini|phps|fla|psd|log|sh)$ {
        deny all;
    }
}
















