##
# Default server configuration
##

server {
        listen 80 default_server;
        listen [::]:80 default_server;

        # ============================================
        # FIX 413 ERROR - ADD THIS LINE
        # ============================================
        client_max_body_size 150M;        # Maximum upload size
        client_body_timeout 300s;         # Timeout for uploads
        client_header_timeout 300s;       # Timeout for headers

        # SSL configuration
        #
        # listen 443 ssl default_server;
        # listen [::]:443 ssl default_server;
        #
        # Note: You should disable gzip for SSL traffic.
        # See: https://bugs.debian.org/773332
        #
        # Read up on ssl_ciphers to ensure a secure configuration.
        # See: https://bugs.debian.org/765782
        #
        # Self signed certs generated by the ssl-cert package
        # Don't use them in a production server!
        #
        # include snippets/snakeoil.conf;

        # ============================================
        # UPDATE ROOT TO YOUR LARAVEL PUBLIC DIRECTORY
        # ============================================
        root /var/www/tourism/public;  # Change this to your actual path
        # If your path is different, update it. Common paths:
        # /var/www/html/tourism/public
        # /home/username/tourism/public
        # /var/www/unisontour.com/public

        # Add index.php to the list if you are using PHP
        index index.php index.html index.htm index.nginx-debian.html;

        server_name _;  # Change to your domain: unisontour.com www.unisontour.com

        # ============================================
        # LARAVEL ROUTING
        # ============================================
        location / {
                # First attempt to serve request as file, then
                # as directory, then fall back to Laravel index.php
                try_files $uri $uri/ /index.php?$query_string;
        }

        # ============================================
        # PHP PROCESSING - UNCOMMENT AND UPDATE
        # ============================================
        location ~ \.php$ {
                include snippets/fastcgi-php.conf;

                # With php-fpm (or other unix sockets):
                # Update php version (7.4, 8.0, 8.1, 8.2, 8.3, etc.)
                fastcgi_pass unix:/run/php/php8.3-fpm.sock;  # Change version if needed
                
                # FastCGI buffer sizes for large uploads
                fastcgi_buffer_size 128k;
                fastcgi_buffers 4 256k;
                fastcgi_busy_buffers_size 256k;
                fastcgi_read_timeout 300s;
                
                # With php-cgi (or other tcp sockets):
                # fastcgi_pass 127.0.0.1:9000;
        }

        # ============================================
        # DENY ACCESS TO HIDDEN FILES
        # ============================================
        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        location ~ /\.ht {
                deny all;
        }
        
        # Deny access to sensitive Laravel files
        location ~* \.(env|log|htaccess|htpasswd|ini|phps|fla|psd|log|sh)$ {
                deny all;
        }
        
        # ============================================
        # STATIC FILES CACHING
        # ============================================
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
        }
}

